# =============================================
# Production profile – values injected by Railway
# =============================================

spring.application.name=mvphack

# Database – Railway provides DATABASE_URL as full JDBC connection string
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings for free tier
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.check-template-location=false

# Server – Railway injects PORT automatically
server.port=${PORT:8080}
server.address=0.0.0.0

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Actuator – expose health endpoint for Railway health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
