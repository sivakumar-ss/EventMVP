# Application
spring.application.name=college-event-management
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/mvphack
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=MyCollegeEventManagementSuperSecretKeyForJWTSigning2024!
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Mail (console-based simulation — no real SMTP needed)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=postgres
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.mvp.event=DEBUG
logging.level.org.springframework.security=WARN
