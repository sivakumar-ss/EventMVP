databases:
  - name: eventmvp-db
    databaseName: mvphack
    user: mvphack_user
    plan: free

services:
  # ── Backend: Spring Boot (Docker) ─────────────────────────────────────────
  - type: web
    name: eventmvp-backend
    runtime: docker
    rootDir: college-event-backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eventmvp-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: eventmvp-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: eventmvp-db
          property: password
      - key: JWT_SECRET
        generateValue: true

  # ── Frontend: React/Vite Static Site ──────────────────────────────────────
  - type: web
    name: eventmvp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: REPLACE_WITH_BACKEND_URL_AFTER_DEPLOY
